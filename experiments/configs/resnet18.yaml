# Baseline Z: CIFAR-style ResNet-18. lr is a placeholder until the validation sweep picks it.
# Shared recipe for every from-scratch model: same data, augmentation, batch size and 300 epochs.
run_name: resnet18
model:
  name: resnet18_cifar
data:
  dir: data
  val_size: 0              # 5000 for learning-rate sweeps (test set untouched), 0 for final runs
  image_size: 32
  normalize: cifar
  crop_scale: [0.8, 1.0]
  randaugment_magnitude: 9
  num_workers: 4
train:
  epochs: 300
  batch_size: 128
  eval_batch_size: 512
  label_smoothing: 0.1
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mix_off_epoch: 175       # Mixup/CutMix switched off for the last 125 epochs, as in the CCT config
  eval_every: 10
  ckpt_every: 25
  clip_grad: null
optim:
  name: sgd
  lr: 0.025  # chosen by the 300-epoch validation sweep
  momentum: 0.9
  nesterov: true
  weight_decay: 5.0e-4
  warmup_epochs: 5
  cooldown_epochs: 0
  min_lr: 0.0
